# Railway/Nixpacks build-config for PaddleOCR-servicen.
# - Pin Python 3.12: paddlepaddle==2.6.2 har INGEN wheels til 3.13+ (build fejler ellers).
# - aptPkgs: PaddleOCR bruger OpenCV som kræver libGL + glib i containeren
#   (ellers runtime-crash: "libGL.so.1: cannot open shared object file").
providers = ["python"]

[phases.setup]
aptPkgs = ["libgl1", "libglib2.0-0"]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT"

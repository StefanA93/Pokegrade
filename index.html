<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5B429" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GradeDex" />
    <meta name="description" content="AI-drevet kortgradéring og portfolio til det europæiske marked. Cardmarket EUR-priser og PSA-estimering." />
    <meta property="og:title" content="GradeDex EU — AI Kortgradéring" />
    <meta property="og:description" content="Scan dine Pokémon-kort og få et præcist PSA-estimat med Cardmarket EUR-priser." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gradedex.eu" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>GradeDex EU</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #080808;
        font-family: 'DM Sans', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      #root { min-height: 100vh; }

      /* ── HTML Splash (shows before React loads) ── */
      #splash {
        position: fixed; inset: 0;
        background: #080808;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }

      .splash-glow {
        position: absolute;
        width: 320px; height: 320px; border-radius: 50%;
        background: radial-gradient(circle, rgba(245,180,41,0.094) 0%, transparent 70%);
        animation: glowPulse 2.5s ease-in-out infinite;
        pointer-events: none;
      }

      .splash-logo {
        display: flex; flex-direction: column; align-items: center;
        gap: 10px; position: relative; z-index: 1;
        animation: splashEntrance 0.7s cubic-bezier(0.34,1.4,0.64,1) both;
      }

      /* Ring row */
      .logo-ring-wrap {
        position: relative;
        width: 124px; height: 100px;
        display: flex; align-items: center;
      }
      .logo-ring-glow {
        position: absolute; left: 0;
        width: 100px; height: 100px; border-radius: 50%;
        box-shadow: 0 0 30px rgba(245,180,41,0.267), 0 0 60px rgba(245,180,41,0.094);
        pointer-events: none;
      }
      .logo-ring {
        width: 100px; height: 100px; border-radius: 50%;
        border: 4px solid #F5B429;
        box-shadow: inset 0 0 20px rgba(200,120,0,0.2);
        background: radial-gradient(circle at 35% 35%, rgba(200,120,0,0.133), transparent 60%);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0; position: relative;
      }
      .logo-arc {
        position: absolute; inset: -4px; border-radius: 50%;
        border: 4px solid transparent;
        border-top-color: #FFD966;
        border-right-color: #FFD966;
        transform: rotate(30deg);
      }
      .logo-g {
        font-size: 44px; font-weight: 900;
        color: #fff; line-height: 1; letter-spacing: -1px;
        text-shadow: 0 0 20px rgba(255,255,255,0.3);
        font-family: 'DM Sans', system-ui, sans-serif;
      }
      .logo-lines {
        display: flex; flex-direction: column;
        gap: 5px; margin-left: 6px;
      }
      .logo-line {
        height: 2.5px; border-radius: 2px;
        background: linear-gradient(to right, #F5B429, transparent);
      }
      .l1 { width: 20px; opacity: 1; }
      .l2 { width: 14px; opacity: 0.7; }
      .l3 { width: 9px; opacity: 0.4; }

      /* Wordmark */
      .logo-wordmark {
        display: flex; align-items: baseline;
      }
      .wm-white {
        font-size: 30px; font-weight: 900;
        color: #fff; letter-spacing: -0.5px; line-height: 1;
        font-family: 'DM Sans', system-ui, sans-serif;
      }
      .wm-gold {
        font-size: 30px; font-weight: 900;
        color: #F5B429; letter-spacing: -0.5px; line-height: 1;
        font-family: 'DM Sans', system-ui, sans-serif;
      }

      /* Tagline */
      .logo-tagline {
        display: flex; align-items: center; gap: 6px;
        font-size: 9px; font-weight: 700;
        color: #707080; letter-spacing: 1.5px;
        font-family: 'DM Sans', system-ui, sans-serif;
      }
      .logo-dot { color: #F5B429; font-size: 8px; }

      /* Shimmer bar */
      .splash-bar {
        position: fixed; bottom: 60px;
        width: 140px; height: 2px;
        background: #1c1c1c; border-radius: 2px; overflow: hidden;
      }
      .splash-bar-inner {
        width: 35%; height: 100%; border-radius: 2px;
        background: linear-gradient(to right, transparent, #F5B429, transparent);
        animation: sweepBar 1.4s ease-in-out infinite;
      }

      @keyframes splashEntrance {
        0%   { opacity: 0; transform: scale(0.75); }
        60%  { opacity: 1; transform: scale(1.04); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50%       { opacity: 0.8; transform: scale(1.12); }
      }
      @keyframes sweepBar {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-glow"></div>
      <div class="splash-logo">
        <div class="logo-ring-wrap">
          <div class="logo-ring-glow"></div>
          <div class="logo-ring">
            <div class="logo-arc"></div>
            <span class="logo-g">G</span>
          </div>
          <div class="logo-lines">
            <div class="logo-line l1"></div>
            <div class="logo-line l2"></div>
            <div class="logo-line l3"></div>
          </div>
        </div>
        <div class="logo-wordmark">
          <span class="wm-white">Grade</span><span class="wm-gold">Dex</span>
        </div>
        <div class="logo-tagline">
          SCAN<span class="logo-dot">•</span>GRADE<span class="logo-dot">•</span>TRACK<span class="logo-dot">•</span>COLLECT
        </div>
      </div>
      <div class="splash-bar"><div class="splash-bar-inner"></div></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e8c56d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GradeDex" />
    <meta name="description" content="AI-drevet kortgradéring og portfolio til det europæiske marked. Cardmarket EUR-priser og PSA-estimering." />
    <meta property="og:title" content="GradeDex EU — AI Kortgradéring" />
    <meta property="og:description" content="Scan dine Pokémon-kort og få et præcist PSA-estimat med Cardmarket EUR-priser." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gradedex.eu" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
    <title>GradeDex EU</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0a12;
        font-family: 'DM Sans', sans-serif;
        -webkit-font-smoothing: antialiased;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      #root { min-height: 100vh; }
      #splash {
        position: fixed; inset: 0;
        background: #0a0a12;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      .splash-icon {
        width: 80px; height: 80px;
        background: linear-gradient(135deg, #e8c56d, #c9963a);
        border-radius: 24px;
        display: flex; align-items: center; justify-content: center;
        font-size: 40px;
        margin-bottom: 20px;
        animation: splashPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .splash-title {
        font-family: 'DM Sans', sans-serif;
        font-size: 28px; font-weight: 900;
        color: #fff; letter-spacing: -0.5px;
        animation: splashFade 0.5s 0.2s ease both;
      }
      .splash-sub {
        font-size: 11px; color: #555;
        letter-spacing: 2px; text-transform: uppercase;
        margin-top: 6px;
        animation: splashFade 0.5s 0.3s ease both;
      }
      @keyframes splashPop {
        from { transform: scale(0.5); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      @keyframes splashFade {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <!-- Splash screen -->
    <div id="splash">
      <div class="splash-icon">⬡</div>
      <div class="splash-title">GradeDex</div>
      <div class="splash-sub">EU Edition</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash');
          if (splash) {
            splash.classList.add('hidden');
            setTimeout(() => splash.remove(), 400);
          }
        }, 1200);
      });
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>

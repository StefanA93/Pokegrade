name: Price Refresh

on:
  schedule:
    - cron: '0 21 * * *'  # dagligt kl. 21:00 UTC (efter TCGCSV opdaterer ~20:00 UTC)
  workflow_dispatch:        # kan også køres manuelt fra Actions-tab

jobs:
  refresh:
    name: Opdater kortpriser
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      CARDMARKET_API_KEY:   ${{ secrets.CARDMARKET_API_KEY }}
      TCGAPI_KEY:           ${{ secrets.TCGAPI_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── CM EUR priser (krævet for alle disse spil) ─────────────────────
      - name: Pokemon EN — Cardmarket EUR
        run: node scripts/backfill-cm-prices.js pokemon

      - name: Lorcana — Cardmarket EUR
        run: node scripts/backfill-cm-prices.js lorcana

      - name: One Piece — Cardmarket EUR
        run: node scripts/backfill-cm-prices.js onepiece

      - name: Riftbound — Cardmarket EUR
        run: node scripts/backfill-cm-prices.js riftbound

      - name: MTG — Scryfall (Cardmarket EUR)
        run: node scripts/backfill-mtg-prices.js

      - name: YuGiOh — YGOProDeck (Cardmarket EUR)
        run: node scripts/backfill-yugioh-prices.js

      # ── Ikke-CM priser (kun accepteret for disse to spil) ─────────────
      - name: Dragon Ball — tcgapi.dev (TCGPlayer USD)
        run: node scripts/backfill-dragonball-prices.js

      - name: Pokemon Japan — TCGCSV (TCGPlayer JP kategori 85, USD)
        run: node scripts/backfill-pokemonjp-prices.js
